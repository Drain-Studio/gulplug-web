<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Drain the Ocean</title>
<style>
  /* Plantilla de Drain Studio para itch.io: el lienzo llena el marco (iframe) y se queda en 16:9 con bandas negras,
     así nunca se corta el HUD. Sin pie de página ni tamaños fijos en píxeles. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #marco { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #unity-canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
                  background: #000; outline: none; }
  #carga { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40%; max-width: 320px;
           height: 6px; background: #222; }
  #carga > div { width: 0; height: 100%; background: #5fd3c6; }
  #aviso { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #fff; font: 14px sans-serif; }
</style>
</head>
<body>
<div id="marco">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="carga"><div></div></div>
  <div id="aviso"></div>
</div>
<script src="Build/web.loader.js"></script>
<script>
  var canvas = document.getElementById('unity-canvas');
  var barra = document.querySelector('#carga > div');
  // El teclado va al juego desde el primer clic.
  canvas.addEventListener('pointerdown', function () { canvas.focus(); });
  function aviso(msg, tipo) {
    var a = document.getElementById('aviso');
    a.textContent = msg;
    if (tipo != 'error') setTimeout(function () { a.textContent = ''; }, 5000);
  }
  createUnityInstance(canvas, {
    dataUrl: 'Build/web.data.unityweb',
    frameworkUrl: 'Build/web.framework.js.unityweb',
    codeUrl: 'Build/web.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: "DefaultCompany",
    productName: "Drain the Ocean",
    productVersion: "0.1.0",
    // En pantalla completa, el marco negro llena la pantalla y el lienzo sigue en 16:9.
    fullscreenElementID: 'marco',
    showBanner: aviso,
  }, function (p) { barra.style.width = (100 * p) + '%'; })
  .then(function () { document.getElementById('carga').remove(); })
  .catch(function (m) { aviso(m, 'error'); });
</script>
</body>
</html>
